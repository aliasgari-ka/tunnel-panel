<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tunnel Panel</title>
<style>
:root{
  --bg:#f3f5fa; --panel:#ffffff; --panel-2:#f2f4f9; --line:#e3e7f0;
  --fg:#1b2030; --muted:#566074; --faint:#8a93a6;
  --accent:#5b5ef6; --accent-fg:#ffffff; --accent-soft:#ecebfe;
  --good:#16a36a; --good-soft:#dcf5ea; --warn:#b7791f; --crit:#d23f4f; --crit-soft:#fbe4e7;
  --mono:"Vazirmatn",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Vazirmatn",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --radius:14px; --shadow:0 1px 2px rgba(20,30,60,.05),0 4px 14px rgba(20,30,60,.05);
  --shadow-up:0 2px 4px rgba(20,30,60,.06),0 12px 28px rgba(40,50,120,.12);
  --grad:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 45%,#06b6d4));
  --glow:color-mix(in srgb,var(--accent) 22%,transparent);
  color-scheme:light;
}
/* vivid but easy on the eyes: deep surfaces, one gradient accent (pick another in the sidebar) */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1017; --panel:#141923; --panel-2:#1b2130; --line:#262e3e;
  --fg:#e3e7ef; --muted:#a3acbd; --faint:#6e788b;
  --accent:#8b88ff; --accent-fg:#0c0f1a; --accent-soft:#24234a;
  --good:#34d399; --good-soft:#123326; --warn:#f4b860; --crit:#f2717e; --crit-soft:#3d1e25;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.18); --shadow-up:0 4px 10px rgba(0,0,0,.35),0 16px 36px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1017; --panel:#141923; --panel-2:#1b2130; --line:#262e3e;
  --fg:#e3e7ef; --muted:#a3acbd; --faint:#6e788b;
  --accent:#8b88ff; --accent-fg:#0c0f1a; --accent-soft:#24234a;
  --good:#34d399; --good-soft:#123326; --warn:#f4b860; --crit:#f2717e; --crit-soft:#3d1e25;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.18); --shadow-up:0 4px 10px rgba(0,0,0,.35),0 16px 36px rgba(0,0,0,.35);
  color-scheme:dark;
}
@font-face{font-family:"Vazirmatn";src:url("/fonts/vazirmatn.woff2") format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:650}
h3{font-size:15px}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:14px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
[hidden]{display:none!important}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh;position:relative;z-index:1;background:linear-gradient(to right,var(--panel) 231px,var(--line) 231px 232px,transparent 232px)}
#qbg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .dot{width:26px;height:26px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.brand b{font-size:15px}.brand small{display:block;color:var(--faint);font-size:11px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--muted);padding:9px 11px;border-radius:9px;text-align:start;width:100%;font-weight:550}
.nav button:hover{background:var(--panel-2);color:var(--fg)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.main{min-width:0;padding:26px clamp(16px,4vw,40px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:21px}.topbar p{margin:2px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 13px;border-radius:9px;font-weight:600;transition:.12s}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.danger:hover{background:var(--crit-soft)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--panel-2);color:var(--fg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.modal .card,.drawer .panel{background:var(--panel)}
.auth{position:relative;z-index:1}
.card.pad{padding:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap}
.pill .led{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.on{background:var(--good-soft);color:var(--good)}
.pill.ok2{background:var(--accent-soft);color:var(--accent)}
.pill.off{background:var(--panel-2);color:var(--faint)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.neutral{background:var(--panel-2);color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea,.inp{background:var(--bg);border:1px solid var(--line);color:var(--fg);padding:9px 11px;border-radius:9px;width:100%}
label.f input:focus,label.f select:focus,label.f textarea:focus,.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
label.row{flex-direction:row;align-items:center;gap:9px}label.row input{width:auto}
.ff{display:grid;gap:13px}.ff .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid{display:grid;gap:14px}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.tgrid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));align-items:start;gap:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:-8px 0 14px}
.fchip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
.fchip b{color:var(--fg);margin-inline-start:3px}
.fchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.grid.cards{align-items:start}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth .card{width:100%;max-width:400px;padding:30px}.auth .brand{justify-content:center;padding-bottom:20px}
.tcard{padding:0}
.tcard .hd{padding:16px 16px 12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tcard .hd h3{font-size:16px}
.route{display:flex;align-items:center;gap:8px;margin-top:7px;font-family:var(--mono);font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.route .node{background:var(--panel-2);padding:3px 8px;border-radius:7px;color:var(--fg)}
.route .arrow{color:var(--accent);font-weight:700}
.tcard .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.method-row{display:flex;gap:8px;align-items:center}
.method-row select{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--fg);padding:9px 10px;border-radius:9px;font-weight:550}
.method-row select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.method-row .btn{white-space:nowrap}
.mwarn{font-size:12.5px;color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:8px;padding:8px 10px;border-inline-start:3px solid var(--warn)}
.traf.err .spark,.traf.err .meta{display:none}
.traf{background:var(--panel-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.traf .rates{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.traf .rates b{font-size:15px;font-weight:650}
.traf .dn{color:var(--accent)}.traf .up{color:var(--good)}
.traf .meta{font-size:11.5px;color:var(--faint);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.spark{width:100%;height:38px;display:block}
.spark .pd{fill:none;stroke:var(--accent);stroke-width:1.6;vector-effect:non-scaling-stroke}
.spark .pu{fill:none;stroke:var(--good);stroke-width:1.2;vector-effect:non-scaling-stroke;opacity:.85}
.spark .ad{fill:var(--accent-soft);stroke:none;opacity:.7}
.nic{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.nic .dn{color:var(--accent)}.nic .up{color:var(--good)}
/* groups (Iran / foreign sections, tunnels per Iran server) */
.group{margin-bottom:28px}
.ghd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ghd h2{font-size:16.5px;display:flex;align-items:center;gap:8px}
.ghd p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.count{font-size:11.5px;font-weight:650;color:var(--muted);background:var(--panel-2);border-radius:999px;padding:2px 9px}
.empty.small{padding:28px 16px}
/* summary strip */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.stat small{display:block;color:var(--faint);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.stat b span{font-size:13px;color:var(--muted);font-weight:600}
.stat .dn{color:var(--accent)}.stat .up{color:var(--good)}
/* server cards */
.scard{padding:16px;display:flex;flex-direction:column;gap:12px}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sname{display:flex;gap:10px;align-items:center;min-width:0}.sname h3{overflow-wrap:anywhere}
.sname small{color:var(--faint);font-size:12px}
.sflag{font-size:26px;line-height:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:12.5px}
.kv dt{color:var(--faint)}.kv dd{margin:0;color:var(--fg);overflow-wrap:anywhere}
.sfoot,.tfoot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
/* ⋯ menu */
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;align-self:flex-start;margin:2px 0 8px}
.seg button{background:transparent;border:0;color:var(--muted);padding:8px 18px;font-weight:650;font-size:13px;cursor:pointer}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.res{margin-top:8px;display:grid;gap:4px}
.rbar{display:grid;grid-template-columns:38px 1fr 40px;align-items:center;gap:8px;font-size:12px}
.rbar .rl{color:var(--faint);font-weight:650}
.rbar .rt{height:7px;border-radius:4px;background:color-mix(in srgb,var(--faint) 22%,transparent);overflow:hidden}
.rbar .rt i{display:block;height:100%;background:var(--good);border-radius:4px;transition:width .4s}
.rbar.warn .rt i{background:var(--warn)}
.rbar.crit .rt i{background:var(--crit)}
.rbar .rv{text-align:end;font-variant-numeric:tabular-nums;font-weight:650}
.rbar .rx{grid-column:2/4;font-size:11px;margin-top:-3px}
.emore{display:inline}
.emore summary{cursor:pointer;display:inline;list-style:none}
.emore summary::-webkit-details-marker{display:none}
.emore[open] summary{display:none}
.emore div{white-space:normal;font-size:12px}
.rspark{width:100%;height:24px;margin-top:2px}
.rspark path{fill:none;stroke-width:1.4;vector-effect:non-scaling-stroke}
.rspark .pc,.rleg .pc{stroke:var(--accent);color:var(--accent)}
.rspark .pm,.rleg .pm{stroke:var(--good);color:var(--good)}
.rinfo{font-size:11.5px}
.rleg{white-space:nowrap}
.rwarn{font-size:12px;color:var(--crit)}
.rprocs summary{cursor:pointer;font-size:12px;color:var(--muted)}
.rprocs table{width:100%;font-size:12px;border-collapse:collapse}
.rprocs td{padding:2px 4px}
.rprocs td:first-child{width:55%;overflow-wrap:anywhere}
.rprocs td:nth-child(2){text-align:end;font-variant-numeric:tabular-nums}
.rprocs td:nth-child(3){text-align:end}
.otab{width:100%;border-collapse:collapse;font-size:13px}
.otab th,.otab td{text-align:start;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.otab th{color:var(--faint);font-weight:600;font-size:12px}
.otab tr.open td{background:color-mix(in srgb,var(--crit) 9%,transparent)}
.modal .card{position:relative}
.mclose{position:absolute;top:10px;inset-inline-end:10px;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);font-size:16px;line-height:1;cursor:pointer;z-index:2}
.modal .card>.mclose+h2,.modal .card>.mclose+h3,.mg-h{padding-inline-end:44px}
.mclose:hover{color:var(--fg);border-color:var(--muted)}
.hsl{display:flex;flex-direction:column;gap:3px;font-size:13px;margin-bottom:8px}
.hsl div{padding:5px 9px;border-radius:7px;background:var(--panel-2)}
.hsl .bad{color:var(--crit)}.hsl .cur{outline:1px solid var(--accent)}
.rt-card{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.rt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.rt-head h3{font-size:16px}
.rt-sum{font-size:12.5px;color:var(--muted);margin-top:2px}.rt-sum .ok{color:var(--good)}.rt-sum .bad{color:var(--crit)}
.rt-rows{display:flex;flex-direction:column;gap:4px}
.rt-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:7px 10px;border-radius:9px;background:var(--panel-2);font-size:13px}
.rt-row .sd{flex:none}.rt-name{min-width:0;overflow-wrap:anywhere}
.rt-mth{color:var(--muted)}.rt-st{margin-inline-start:auto;font-weight:600;color:var(--faint)}
.rt-st.ok{color:var(--good)}.rt-st.bad{color:var(--crit)}
.rt-hs{flex-basis:100%;font-size:12.5px;color:var(--muted);padding-inline-start:20px}
.rt-hs summary{cursor:pointer;list-style:none}.rt-hs .hsl{margin:6px 0 2px}
.rt-tbl{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:13px}
.rt-tbl th{text-align:start;font-size:11px;font-weight:650;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;padding:2px 10px}
.rt-tbl td{background:var(--panel-2);padding:7px 10px;vertical-align:middle}
.rt-tbl td:first-child{border-radius:9px 0 0 9px}.rt-tbl td:last-child{border-radius:0 9px 9px 0}
.rt-mn{font-weight:600;white-space:nowrap}
.rt-c{white-space:nowrap}.rt-c>*{vertical-align:middle}
/* the route's on/off switch per method and family */
.rt-sw{position:relative;display:inline-block;width:30px;height:17px;margin-inline-end:9px;cursor:pointer;flex:none}
.rt-sw input{position:absolute;opacity:0;width:0;height:0}
.rt-sw i{position:absolute;inset:0;border-radius:99px;background:color-mix(in srgb,var(--faint) 45%,transparent);transition:background .15s}
.rt-sw i::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.rt-sw input:checked+i{background:var(--good)}
.rt-sw input:checked+i::after{transform:translateX(13px)}
.rt-sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.rt-c .btn{float:inline-end;padding:1px 7px;opacity:.45;margin-inline-start:6px}.rt-c:hover .btn{opacity:1}
.rt-rank{display:inline-grid;place-items:center;min-width:22px;height:20px;border-radius:6px;background:var(--panel);font-size:11.5px;font-weight:700;margin-inline-end:6px}
.rt-rank.top{background:var(--good-soft);color:var(--good)}
.rt-num{font-variant-numeric:tabular-nums}.rt-num small{color:var(--faint);font-size:11px}
.rt-car{font-size:11px;margin-inline-start:6px;padding:1px 6px}
.rt-err{background:none;border:0;padding:0;color:var(--crit);font:inherit;cursor:pointer;text-align:start}
.rt-c.left span{color:var(--faint);text-decoration:line-through}
.rt-leg{font-size:11.5px;margin-top:2px}
@media(max-width:700px){
  .rt-tbl,.rt-tbl tbody,.rt-tbl tr,.rt-tbl td{display:block;width:100%}
  .rt-tbl thead{display:none}
  .rt-tbl tr{background:var(--panel-2);border-radius:10px;margin-bottom:6px;padding:4px 0}
  .rt-tbl td{background:none;border-radius:0!important;padding:4px 12px;white-space:normal}
  .rt-tbl td.rt-c::before{content:attr(data-f);display:inline-block;min-width:44px;font-size:11px;font-weight:650;color:var(--faint)}
}
.rt-ts{display:flex;flex-direction:column;gap:6px}
.rt-t{padding:8px 10px;border-radius:9px;background:var(--panel-2);border-inline-start:3px solid var(--line)}
.rt-t.ok{border-color:var(--good)}.rt-t.bad{border-color:var(--crit)}.rt-t.bad .st{color:var(--crit)}.rt-t.ok .st{color:var(--good)}
.rt-m{display:flex;justify-content:space-between;align-items:center;gap:6px}
.rt-m .btn{padding:2px 8px;opacity:.55}.rt-m:hover .btn{opacity:1}
.rt-off{margin-top:6px;font-size:12px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rt-off .chip{border:1px dashed var(--line);cursor:pointer;text-decoration:line-through;text-decoration-color:var(--faint)}
.rt-bs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
details.more{position:relative}
.card.raised,.card:has(details.more[open]){position:relative;z-index:35}
/* the page sections are layers of their own (their page-in animation): lift the one with the open menu over the next */
.main>.raised,.main>*:has(details.more[open]){position:relative;z-index:36}
details.more>summary{list-style:none}
details.more .pop{position:absolute;inset-inline-end:0;top:calc(100% + 4px);z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;min-width:200px;display:flex;flex-direction:column}
.mi{background:none;border:0;color:var(--fg);text-align:start;padding:8px 10px;border-radius:7px;font-size:13px;font-weight:550}
.mi:hover{background:var(--panel-2)}.mi.danger{color:var(--crit)}
/* compact tunnel cards */
.tc{padding:12px 13px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tc.live{border-color:color-mix(in srgb,var(--good) 35%,var(--line))}
.tc.live.down{border-color:var(--crit);box-shadow:0 0 0 1px var(--crit),var(--shadow);background:color-mix(in srgb,var(--crit) 7%,var(--panel))}
.tc.down .tc-r .ln.on{border-top:2px dashed var(--crit)}
.downbar{font-size:12px;color:var(--crit);background:var(--crit-soft);border-radius:8px;padding:6px 9px}
.downbar a{color:var(--crit);font-weight:650;margin-inline-start:6px}
.pill.bad{background:var(--crit-soft);color:var(--crit)}
.downtxt{font-size:13px;color:var(--crit);font-weight:650}
.tc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tc-h h3{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tc-r{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;min-width:0}
.tc-r .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.tc-r .nm.r{text-align:end}
.tc-r .ln{flex:1;min-width:16px;border-top:2px dashed var(--line)}
.tc-r .ln.on{border-top:2px solid var(--good)}
.tc-m{display:flex;gap:5px;flex-wrap:wrap;min-width:0}
.tc-m .chip{font-size:11.5px;padding:2px 7px}
.chip.bad{color:var(--crit);border-color:var(--crit)}

.igp .mat{overflow:auto}
.igp .mat .tbl td,.igp .mat .tbl th{white-space:nowrap}
.igp .secret{-webkit-text-security:disc}
.igp .igd{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);margin-inline-end:4px;vertical-align:middle}.igp .igd.ok{background:var(--good)}.igp .igd.bad{background:var(--crit)}
.igp #igsub{margin-bottom:14px}
@media(max-width:700px){
  .igp .mat .tbl,.igp .mat .tbl tbody{display:block}.igp .mat .tbl thead{display:none}
  .igp .mat .tbl tr{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--panel-2);border-radius:12px;padding:10px;margin-bottom:8px}
  .igp .mat .tbl td{display:block;background:none;padding:0;border-radius:0!important;white-space:normal}
  .igp .mat .tbl td:first-child{grid-column:1/-1;font-size:14px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .igp .mat .tbl td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--faint);font-weight:650;margin-bottom:2px}
  .igp .mat .tbl td select{width:100%}
  .igp .svcs{grid-template-columns:1fr 1fr 1fr}.igp .svc{padding:6px 7px}
}
</style>
</head>
<body></body>
<script src="/app.js"></script>
</html>
