<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tunnel Panel</title>
<script src="/boot.js"></script>
<style>
:root{
  --mono:"Vazirmatn",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Vazirmatn",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --radius:14px;
  --grad:var(--accent);
  --glow:color-mix(in srgb,var(--accent) 22%,transparent);
}
/* three themes: white (light), graphite (charcoal grey) and black (true dark). Nothing chosen
   yet: the system's light / dark (boot.js sets data-theme before the first paint; the media
   query covers a page without script). Every colour on every page comes from these tokens. */
:root,:root[data-theme="white"]{
  --bg:#f4f5f8; --panel:#ffffff; --panel-2:#f1f3f7; --line:#e1e5ec;
  --fg:#181b22; --muted:#4f5766; --faint:#646c7b;
  --accent:#5357f0; --accent-def:#5357f0; --accent-fg:#ffffff; --accent-soft:#ecebfe;
  --good:#0f7a4f; --good-soft:#dcf5ea; --warn:#8f5d10; --crit:#c9303f; --crit-soft:#fbe4e7;
  --shadow:0 1px 2px rgba(20,30,60,.05),0 4px 14px rgba(20,30,60,.05);
  --shadow-up:0 2px 4px rgba(20,30,60,.06),0 12px 28px rgba(40,50,120,.12);
  --scrim:rgba(15,18,26,.45);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  --bg:#000000; --panel:#0f0f11; --panel-2:#18181b; --line:#27272c;
  --fg:#ededf0; --muted:#a6a6b0; --faint:#80808b;
  --accent:#8f8cff; --accent-def:#8f8cff; --accent-fg:#0c0f1a; --accent-soft:#1f1e3a;
  --good:#3dd68c; --good-soft:#0c2a1d; --warn:#f2b55c; --crit:#ff7a86; --crit-soft:#361519;
  --shadow:0 1px 2px rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.4); --shadow-up:0 4px 10px rgba(0,0,0,.6),0 16px 36px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="black"]{
  --bg:#000000; --panel:#0f0f11; --panel-2:#18181b; --line:#27272c;
  --fg:#ededf0; --muted:#a6a6b0; --faint:#80808b;
  --accent:#8f8cff; --accent-def:#8f8cff; --accent-fg:#0c0f1a; --accent-soft:#1f1e3a;
  --good:#3dd68c; --good-soft:#0c2a1d; --warn:#f2b55c; --crit:#ff7a86; --crit-soft:#361519;
  --shadow:0 1px 2px rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.4); --shadow-up:0 4px 10px rgba(0,0,0,.6),0 16px 36px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-theme="graphite"]{
  --bg:#1d1f22; --panel:#26282c; --panel-2:#2f3236; --line:#3b3e44;
  --fg:#eceef1; --muted:#b4b8c0; --faint:#90959e;
  --accent:#a3a0ff; --accent-def:#a3a0ff; --accent-fg:#14152a; --accent-soft:#36355a;
  --good:#4ad89a; --good-soft:#1d3a2e; --warn:#f4bd6a; --crit:#ff8a94; --crit-soft:#4a272c;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.22); --shadow-up:0 4px 10px rgba(0,0,0,.4),0 16px 36px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}
@font-face{font-family:"Vazirmatn";src:url("/fonts/vazirmatn.woff2") format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:650}
h3{font-size:15px}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:14px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
[hidden]{display:none!important}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh;position:relative;z-index:1;background:linear-gradient(to right,var(--panel) 231px,var(--line) 231px 232px,transparent 232px)}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:18px 14px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .dot{width:26px;height:26px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.brand b{font-size:15px}.brand small{display:block;color:var(--faint);font-size:11px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--muted);padding:9px 11px;border-radius:9px;text-align:start;width:100%;font-weight:550}
.nav button:hover{background:var(--panel-2);color:var(--fg)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.main{min-width:0;padding:26px clamp(16px,4vw,40px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:21px}.topbar p{margin:2px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 13px;border-radius:9px;font-weight:600;transition:.12s}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.danger:hover{background:var(--crit-soft)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--panel-2);color:var(--fg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.modal .card,.drawer .panel{background:var(--panel)}
.card.pad{padding:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap}
.pill .led{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.on{background:var(--good-soft);color:var(--good)}
.pill.ok2{background:var(--accent-soft);color:var(--accent)}
.pill.off{background:var(--panel-2);color:var(--faint)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea,.inp{background:var(--bg);border:1px solid var(--line);color:var(--fg);padding:9px 11px;border-radius:9px;width:100%}
label.f input:focus,label.f select:focus,label.f textarea:focus,.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
label.row{flex-direction:row;align-items:center;gap:9px}label.row input{width:auto}
.ff{display:grid;gap:13px}.ff .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:-8px 0 14px}
.fchip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
.fchip b{color:var(--fg);margin-inline-start:3px}
.fchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.grid.cards{align-items:start}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.method-row{display:flex;gap:8px;align-items:center}
.method-row select{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--fg);padding:9px 10px;border-radius:9px;font-weight:550}
.method-row select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.method-row .btn{white-space:nowrap}
.mwarn{font-size:12.5px;color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:8px;padding:8px 10px;border-inline-start:3px solid var(--warn)}
.traf.err .spark,.traf.err .meta{display:none}
.traf{background:var(--panel-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.traf .rates{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.traf .rates b{font-size:15px;font-weight:650}
.traf .dn{color:var(--accent)}.traf .up{color:var(--good)}
.traf .meta{font-size:11.5px;color:var(--faint);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.spark{width:100%;height:38px;display:block}
.spark .pd{fill:none;stroke:var(--accent);stroke-width:1.6;vector-effect:non-scaling-stroke}
.spark .pu{fill:none;stroke:var(--good);stroke-width:1.2;vector-effect:non-scaling-stroke;opacity:.85}
.spark .ad{fill:var(--accent-soft);stroke:none;opacity:.7}
.nic{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.nic .dn{color:var(--accent)}.nic .up{color:var(--good)}
/* groups (Iran / foreign sections, tunnels per Iran server) */
.group{margin-bottom:28px}
.ghd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ghd h2{font-size:16.5px;display:flex;align-items:center;gap:8px}
.ghd p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.count{font-size:11.5px;font-weight:650;color:var(--muted);background:var(--panel-2);border-radius:999px;padding:2px 9px}
.empty.small{padding:28px 16px}
/* summary strip */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.stat small{display:block;color:var(--faint);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.stat b span{font-size:13px;color:var(--muted);font-weight:600}
.stat .dn{color:var(--accent)}.stat .up{color:var(--good)}
/* server cards */
.scard{padding:16px;display:flex;flex-direction:column;gap:12px}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sname{display:flex;gap:10px;align-items:center;min-width:0}.sname h3{overflow-wrap:anywhere}
.sname small{color:var(--faint);font-size:12px}
.sflag{font-size:26px;line-height:1}
.flagi{display:inline-block;flex:none;justify-self:start;height:.8em;width:auto;aspect-ratio:4/3;vertical-align:-.08em;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.14);object-fit:cover}
.flagc{height:auto;width:auto;aspect-ratio:auto;padding:0 .2em;font:700 .55em/1.5 ui-monospace,monospace;background:var(--panel-2);color:var(--muted);box-shadow:none}
.sflag .flagi{height:.95em}
.sfoot,.tfoot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* servers page: the list, and the chosen server beside it */
.srvsplit{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:24px}
.srvlist{padding:8px;display:flex;flex-direction:column;gap:6px;position:sticky;top:12px;max-height:calc(100vh - 40px);overflow:auto}
.srvlist .sq{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--fg);font:inherit;font-size:13px}
.sgh{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.sgh .btn{text-transform:none;letter-spacing:0;padding:3px 10px}
.sempty{font-size:12.5px;padding:6px 10px 10px}
.srow{display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--fg);font:inherit;text-align:start;cursor:pointer}
.srow:hover{background:var(--panel-2)}
.srow.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.srow .sflag{font-size:20px}
.srow .sinfo{display:flex;flex-direction:column;min-width:0;flex:1}
.srow .sinfo b{font-size:13.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sinfo small{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis}
.srow .smeta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:11px;white-space:nowrap}
.srow .smeta small{font-size:11px;font-variant-numeric:tabular-nums}
.led.on,.led.ok2,.led.off{width:8px;height:8px;border-radius:50%;display:inline-block}
.led.on{background:var(--good)}.led.ok2{background:var(--accent)}.led.off{background:color-mix(in srgb,var(--faint) 55%,transparent)}
.srvdetail .scard{padding:20px;gap:14px}
.srvdetail .kv{grid-template-columns:auto 1fr;font-size:13px;gap:6px 18px}
.tchip{display:inline-block;font-size:12px;padding:1px 8px;margin:1px 0;border-radius:999px;background:var(--good-soft);color:var(--good)}
.tchip.off{background:var(--panel-2);color:var(--faint)}
/* the web SSH console */
.modal.conm .card{max-width:1100px;width:100%;height:min(80vh,720px);display:flex;flex-direction:column;padding:12px;gap:10px;overflow:hidden}
.modal.conm.full{padding:0}.modal.conm.full .card{max-width:none;height:100vh;max-height:none;border-radius:0}
.modal.gbm .card{height:min(88vh,860px)}
.gbhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-inline-end:40px}.gbhead h2{margin:0}
.gbst{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2)}
.gbst.ok{color:var(--good);border-color:currentColor}.gbst.bad{color:var(--crit);border-color:currentColor}.gbst.wait{color:var(--muted)}
.gbhint{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.gbwrap{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000}
.gbframe{display:block;width:100%;height:100%;border:0}
.gbfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@media (max-width:640px){.modal.gbm{padding:0}.modal.gbm .card{height:100dvh;max-height:none;border-radius:0;padding:10px}}
.conhd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.conm .term{flex:1;min-height:0;border-radius:10px;overflow:hidden;padding:6px;border:1px solid var(--line)}
.grow{flex:1}
/* ⋯ menu */
.seg{display:flex;gap:2px;padding:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;align-self:flex-start;margin:2px 0 8px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{background:transparent;border:0;border-radius:9px;color:var(--muted);padding:7px 15px;font-weight:650;font-size:13px;cursor:pointer;white-space:nowrap;flex:none;transition:background .15s,color .15s}
.seg button:hover:not(.on){color:var(--fg);background:color-mix(in srgb,var(--fg) 6%,transparent)}
.seg button.on{background:var(--accent);color:var(--accent-fg);box-shadow:0 1px 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.res{margin-top:8px;display:grid;gap:4px}
.rbar{display:grid;grid-template-columns:38px 1fr 40px;align-items:center;gap:8px;font-size:12px}
.rbar .rl{color:var(--faint);font-weight:650}
.rbar .rt{height:7px;border-radius:4px;background:color-mix(in srgb,var(--faint) 22%,transparent);overflow:hidden}
.rbar .rt i{display:block;height:100%;background:var(--good);border-radius:4px;transition:width .4s}
.rbar.warn .rt i{background:var(--warn)}
.rbar.crit .rt i{background:var(--crit)}
.rbar .rv{text-align:end;font-variant-numeric:tabular-nums;font-weight:650}
.rbar .rx{grid-column:2/4;font-size:11px;margin-top:-3px}
.emore{display:inline}
.emore summary{cursor:pointer;display:inline;list-style:none}
.emore summary::-webkit-details-marker{display:none}
.emore[open] summary{display:none}
.emore div{white-space:normal;font-size:12px}
.rspark{width:100%;height:24px;margin-top:2px}
.rspark path{fill:none;stroke-width:1.4;vector-effect:non-scaling-stroke}
.rspark .pc,.rleg .pc{stroke:var(--accent);color:var(--accent)}
.rspark .pm,.rleg .pm{stroke:var(--good);color:var(--good)}
.rinfo{font-size:11.5px}
.rleg{white-space:nowrap}
.rwarn{font-size:12px;color:var(--crit)}
.rprocs summary{cursor:pointer;font-size:12px;color:var(--muted)}
.rprocs table{width:100%;font-size:12px;border-collapse:collapse}
.rprocs td{padding:2px 4px}
.rprocs td:first-child{width:55%;overflow-wrap:anywhere}
.rprocs td:nth-child(2){text-align:end;font-variant-numeric:tabular-nums}
.rprocs td:nth-child(3){text-align:end}
/* outage log: filters, "down the most" summary, day cards of one-line rows */
.olog .qi{font-size:13px;font-weight:500;color:var(--faint);cursor:help}
.olog .ohd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.seg.sm{margin:0;padding:2px;border-radius:10px}.seg.sm button{padding:5px 11px;font-size:12.5px;border-radius:8px}
.ofil{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.ochk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer}
.opick{cursor:pointer;border:1px solid var(--line);color:var(--fg);font-weight:600}
.oempty{padding:16px;color:var(--muted)}
.osum{padding:10px 12px;margin-bottom:10px}
.osh{font-size:12.5px;font-weight:650;margin:0 2px 6px}
.osr{display:grid;grid-template-columns:22px minmax(0,1.3fr) minmax(40px,1fr) auto 64px;align-items:center;gap:8px;width:100%;background:none;border:0;color:var(--fg);padding:5px 4px;border-radius:8px;cursor:pointer;font-size:13px;text-align:start}
.osr:hover{background:var(--panel-2)}
.osr>b:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.osr>b.mono{text-align:end;font-size:12.5px}
.osr.live>b:first-of-type{color:var(--crit)}
.obar{height:6px;border-radius:99px;background:var(--panel-2);overflow:hidden}.obar i{display:block;height:100%;border-radius:99px;background:color-mix(in srgb,var(--crit) 70%,var(--warn))}
.oday{padding:2px 0;margin-bottom:10px;overflow:hidden}
.odh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:9px 14px 7px;font-size:13px;border-bottom:1px solid var(--line)}
.oday.onow{border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.oday.onow .odh{background:var(--crit-soft);color:var(--crit)}
.orow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px}
.orow:last-child{border-bottom:0}
.orow.live{background:color-mix(in srgb,var(--crit) 6%,transparent)}
.oic{font-size:15px;text-align:center}
.om{min-width:0;display:flex;flex-direction:column;gap:1px}
.om>b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc{font-size:12px}.oc.bad{color:var(--crit)}.oc.warn{color:var(--warn)}
.ot{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:12px;white-space:nowrap}
.ot>b{font-size:13px}
.orow.live .ot>b{color:var(--crit)}
.ofold{display:block;width:100%;background:none;border:0;border-top:1px dashed var(--line);color:var(--muted);padding:8px 14px;font-size:12.5px;text-align:start;cursor:pointer}
.ofold:hover{background:var(--panel-2);color:var(--fg)}
@media (max-width:600px){.olog .ghd{flex-wrap:wrap;align-items:flex-start}.olog .ohd{justify-content:flex-start}.osr{grid-template-columns:20px minmax(0,1fr) auto 58px}.osr .obar{display:none}.orow{padding:8px 10px;gap:8px}.odh{padding:9px 10px 7px}}
.modal .card{position:relative}

/* a short fade when a page opens; nothing loops */
.main.enter>*{animation:fade .18s ease-out both}
@keyframes fade{from{opacity:0}}
/* a running tunnel: green edge on the start side; a down one: red edge, no glow */
.tc.live{border-inline-start:3px solid var(--good)}

.tc-r .ln.on{border-top:2px solid var(--good)}

.bkbtn{justify-content:flex-start;text-decoration:none}

.sw1 i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}

.sw1 input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.modal .card{border-radius:16px;box-shadow:var(--shadow-up)}
optgroup{font-weight:700;color:var(--accent)}
optgroup option{color:var(--fg);font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:860px){

  .side.open{transform:none}
  .menu-toggle{display:inline-flex}
  .opts,.ff .two{grid-template-columns:1fr}
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* phones: compact stats without icons, filter chips in one row you swipe */
  .summary{gap:8px;margin-bottom:16px}.stat{padding:9px 11px;display:block}.stat .si{display:none}.stat b{font-size:16px}
  .filters{flex-wrap:nowrap;overflow-x:auto;margin-inline:-4px;padding:0 4px 4px}.filters>*{flex:none}.inp.search{flex:0 0 200px}
  .grid.cards{grid-template-columns:1fr}
  .srvsplit{grid-template-columns:1fr}.srvlist{position:static;max-height:none}
  .usplit .srvlist{max-height:46vh}
  .modal.conm{padding:0}.modal.conm .card{height:100vh;max-height:none;border-radius:0}
  /* phones: no blur behind cards (it is what trapped the ⋯ menu under the next card, and it is slow
     over the animated background); the ⋯ menu opens as a bottom sheet with big touch targets */
  details.more[open]>summary::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:68}
  details.more .pop{position:fixed;inset-inline:10px;top:auto;bottom:calc(10px + env(safe-area-inset-bottom));z-index:70;min-width:0;padding:8px;border-radius:14px;max-height:70vh;overflow:auto}
  .mi{padding:13px 12px;font-size:15px}
}

.lk-th.on{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
/* a tiny picture of each theme: page, a card on it and the accent */
.lk-prev{display:block;width:100%;max-width:52px;height:30px;border-radius:7px;position:relative;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35);overflow:hidden}
.lk-prev>i{position:absolute;inset:7px 7px 0 7px;border-radius:5px 5px 0 0}
.lk-prev::after{content:"";position:absolute;top:12px;inset-inline-start:12px;width:16px;height:4px;border-radius:2px;background:var(--accent)}
.lk-black{background:#000}.lk-black>i{background:#18181b}
.lk-graphite{background:#1d1f22}.lk-graphite>i{background:#2f3236}
.lk-white{background:#eef0f4}.lk-white>i{background:#fff}
.lk-sys{align-self:flex-start;background:none;border:0;padding:2px 0;font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}
.lk-sys::before{content:"";width:12px;height:12px;border-radius:4px;border:1.5px solid var(--faint);flex:none}
.lk-sys.on{color:var(--fg)}.lk-sys.on::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--panel)}
.lk-sys:hover{color:var(--fg)}
.me-pop .swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:24px;height:24px;border-radius:50%;border:3px solid var(--panel);background:var(--c,var(--accent));box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;transition:box-shadow .15s}
.sw.on,.sw:hover{box-shadow:0 0 0 2px var(--fg)}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.me-pop .seg{margin:0;align-self:stretch}.me-pop .seg button{flex:1;padding:6px 8px;font-size:12.5px}
.lk-ver{margin-top:6px;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);display:flex;justify-content:space-between;gap:6px}
.lk-ver .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}

/* sign-in page: one calm card, the language at the top */
.auth{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 16px calc(24px + env(safe-area-inset-bottom));position:relative;z-index:1;
  background:radial-gradient(900px 420px at 50% -10%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%),var(--bg)}
.auth-top{position:absolute;top:calc(14px + env(safe-area-inset-top));inset-inline-end:16px}
.auth-top .seg{margin:0}.auth-top .seg button{padding:5px 12px;font-size:12.5px}
.auth-card{width:100%;max-width:380px;padding:30px 28px 26px;border-radius:18px;box-shadow:var(--shadow-up)}
.auth-brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;margin-bottom:22px}
.auth-mark{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;color:var(--accent);background:var(--accent-soft);margin-bottom:8px}
.auth-brand h1{font-size:20px;font-weight:750;letter-spacing:-.01em;overflow-wrap:anywhere}
.auth-brand p{margin:0;color:var(--faint);font-size:12.5px}
.auth-form{display:grid;gap:14px}
.auth-form label.f{font-size:12.5px}
.auth-form label.f input{background:var(--panel-2);padding:11px 12px;font-size:15px;border-radius:10px;height:44px}
.auth-form label.f input[dir=ltr]{text-align:left}
.auth-pw{position:relative;display:block}
.auth-pw input{padding-inline-end:44px!important}
[dir=rtl] .auth-pw input{padding-inline-end:12px!important;padding-right:44px!important}
.auth-eye{position:absolute;top:50%;right:4px;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--faint)}
.auth-eye:hover{color:var(--fg);background:color-mix(in srgb,var(--fg) 7%,transparent)}
/* the browser's autofill keeps the theme's colours (not a yellow / white block) */
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-text-fill-color:var(--fg);caret-color:var(--fg);-webkit-box-shadow:0 0 0 60px var(--panel-2) inset;box-shadow:0 0 0 60px var(--panel-2) inset;transition:background-color 9999s}
.auth-go{justify-content:center;height:46px;font-size:15px;border-radius:11px;margin-top:4px}
.auth-go:disabled{opacity:.75;cursor:progress}
.auth-go.busy::before{content:"";width:15px;height:15px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-err{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--crit-soft);color:var(--crit);font-size:13px;font-weight:600;line-height:1.5}
.auth-err svg{flex:none;margin-top:2px}
.auth-err.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.auth-note{display:flex;flex-direction:column;gap:3px;padding:10px 12px;margin-bottom:14px;border-radius:10px;background:var(--accent-soft);color:var(--fg);font-size:13px;line-height:1.55}
@media (max-width:420px){.auth{justify-content:flex-start;padding-top:72px}.auth-card{padding:24px 18px 20px;border-radius:16px}}
/* ---- Routes page: one tunnel at a time (.rx-) ---- */
.rx .rx-list{gap:2px}
.rx-row{padding:7px 9px}
.rx-cc{flex:none;display:inline-grid;place-items:center;width:30px;height:26px;border-radius:7px;background:var(--panel-2);font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.srow.on .rx-cc{background:var(--panel)}
.rx-row .sinfo small{white-space:nowrap}
.rx-dot{flex:none;width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--faint) 50%,transparent)}
.rx-dot.ok{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.rx-dot.bad{background:var(--crit);box-shadow:0 0 0 3px var(--crit-soft)}
.rx-dot.unk{background:var(--warn)}
.rx-strip{display:none}
.rx-card{gap:12px}
.rx-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.rx-ht{min-width:0}.rx-ht h3{font-size:18px;overflow-wrap:anywhere}
.rx-route{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12.5px;color:var(--muted);margin-top:3px}
.rx-arr{color:var(--faint)}
.rx-ha{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rx-st.bad{background:var(--crit-soft);color:var(--crit)}.rx-st.unk{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.rx-hero{border-radius:12px;padding:12px 14px;background:var(--panel-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.rx-hero.ok{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.rx-hero.bad{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.rx-hk{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rx-hl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:15px}.rx-hl b{font-size:17px}
.rx-since{font-size:12.5px;color:var(--muted)}
.rx-hq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px}
.rx-qv{font-variant-numeric:tabular-nums;color:var(--fg)}.rx-qv b{font-weight:700}
.rx-warn{font-size:12.5px;color:var(--warn)}.rx-hero.bad .rx-warn{color:var(--crit)}
.rx-fam{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--panel);color:var(--muted);border:1px solid var(--line);vertical-align:middle;direction:ltr}
.rx-sec{display:flex;flex-direction:column;gap:6px}
.rx-sh,.rx-more>summary{display:flex;align-items:center;gap:8px;font-size:13px}
.rx-more>summary{cursor:pointer;list-style:none;padding:8px 2px;border-top:1px solid var(--line)}
.rx-more>summary::-webkit-details-marker{display:none}
.rx-chev{margin-inline-start:auto;color:var(--faint);transition:transform .15s}.rx-more[open] .rx-chev{transform:rotate(180deg)}
.rx-more .rt-leg{margin-top:4px}
.rx-paths{display:flex;flex-direction:column;gap:4px}
.rx-p{display:grid;grid-template-columns:18px minmax(0,1fr) auto auto;align-items:center;gap:4px 10px;padding:8px 10px;border-radius:10px;background:var(--panel-2);border:1px solid transparent;font-size:13px}
.rx-p.cur{border-color:color-mix(in srgb,var(--good) 45%,transparent);background:color-mix(in srgb,var(--good) 8%,var(--panel-2))}
.rx-p.left{opacity:.62}
.rx-i{font-weight:700;color:var(--good);text-align:center}.rx-p.bad .rx-i{color:var(--crit)}
.rx-pm{display:flex;flex-direction:column;min-width:0}
.rx-pn{font-weight:600;overflow-wrap:anywhere}
.rx-pq{font-size:11.5px;color:var(--faint);min-width:0}
.rx-why{color:var(--crit);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rx-pb{font-size:12px;white-space:nowrap;display:flex;align-items:center}
.rx-num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}.rx-num small{color:var(--faint);font-size:10.5px}
.rx-pa{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.rx-users{color:var(--good);font-size:12px;white-space:nowrap}
.rx-legend div+div{margin-top:2px}
.rx-fams{display:flex;gap:16px}
.rx-sheet{max-height:65vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
@media (max-width:860px){
  .rx .rx-list{display:none}
  .rx-strip{display:flex;gap:6px;align-items:center;position:sticky;top:0;z-index:5;margin:0 -4px 10px;padding:6px 4px;background:var(--bg)}
  .rx-all{flex:none;width:36px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:16px;cursor:pointer}
  .rx-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  .rx-chips::-webkit-scrollbar{display:none}
  .rx-chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .rx-chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .rx-card{padding:14px}
  .rx-p{grid-template-columns:18px minmax(0,1fr) auto;padding:8px 9px}
  .rx-p .rx-pb{grid-column:2;grid-row:2}
  .rx-p .rx-pa{grid-column:3;grid-row:1 / span 2}
}
/* Repair: the check, the choice and the run (repairModal) */
.rp-sub{margin:-4px 0 12px;font-size:13px}
.rp-wait{display:flex;align-items:center;gap:10px;padding:18px 4px;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);border-top-color:transparent;animation:spin .7s linear infinite;flex:none}
.rp-sum{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip.ok{color:var(--good);background:var(--good-soft)}
.rp-t{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.rp-h{display:flex;align-items:center;gap:8px;cursor:pointer;flex-wrap:wrap}
.rp-h b{font-size:14px}
.rp-i{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:4px 8px;align-items:start;padding:7px 0 2px;border-top:1px dashed var(--line);margin-top:7px;cursor:pointer;font-size:13px}
.rp-i input,.rp-h input{margin:2px 0 0;width:16px;height:16px;accent-color:var(--accent)}
.rp-x{min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:2px}
.rp-c{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.rp-c .chip{font-size:11px;padding:1px 8px;white-space:nowrap}
.rp-note{font-size:12px;color:var(--faint);margin-top:4px}
.rp-why{font-size:12px;color:var(--faint)}
.rp-det{font-size:11.5px;color:var(--faint);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:start}
.rp-ri.failed .rp-why{color:var(--crit)}
.rp-st{font-weight:700;text-align:center}.rp-ri.done .rp-st{color:var(--good)}.rp-ri.failed .rp-st{color:var(--crit)}.rp-ri.left{opacity:.75}
.rp-r .rp-h{cursor:default}.rp-ic{width:20px;text-align:center}
.rp-r.running{border-color:var(--accent)}.rp-r.failed{border-color:color-mix(in srgb,var(--crit) 45%,transparent)}
.rp-allok{padding:12px;border-radius:12px;background:var(--good-soft);color:var(--good);font-weight:600;margin-bottom:8px}
.rp-ok{margin:10px 0 4px}.rp-lbl{font-size:12px;color:var(--faint);margin-bottom:4px}
.rp-okr{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 2px;flex-wrap:wrap}.rp-okr .rp-note{margin:0}
.rp-dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}.rp-dot.ok{background:var(--good)}
.rp-warn{border:1px solid color-mix(in srgb,var(--crit) 45%,transparent);background:var(--crit-soft);border-radius:12px;padding:12px;margin:10px 0;font-size:13px;display:grid;gap:6px}
.rp-warn b{color:var(--crit)}.rp-names{font-weight:600}.rp-warn .actions{justify-content:flex-end}
.rp-foot{margin-top:12px;position:sticky;bottom:-22px;background:var(--panel);padding:10px 0 4px;border-top:1px solid var(--line)}
.rp-foot .rp-warn{margin:0 0 10px}
.rp-log{margin-top:8px;font-size:12.5px}.rp-log summary{cursor:pointer;color:var(--muted)}.rp-log .pre{max-height:220px;font-size:11.5px;margin-top:6px}
.rp-when{font-size:12px}
.rp-auto{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:8px}
.rp-auto .f{display:grid;gap:4px;font-size:13px}.rp-last{font-size:12.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
@media (max-width:640px){.rp-i{grid-template-columns:20px minmax(0,1fr)}.rp-c{grid-column:2;justify-content:flex-start}.rp-foot .actions .grow{display:none}.rp-foot .actions .btn{flex:1 1 0;white-space:nowrap;justify-content:center;padding-inline:10px}}
</style>
