name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the arm64 cross compiler (apt)
        timeout-minutes: 6
        continue-on-error: true # the runner's Ubuntu mirror hangs/fails at times: zig below covers it
        run: |
          inst() { sudo timeout 120 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 "$@"; }
          inst update -qq && inst install -y -qq gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: zig (cross C compiler without apt)
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Build
        run: |
          bash build.sh amd64 arm64
          cd dist && sha256sum tunnel-panel-amd64 tunnel-panel-arm64 > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          make_latest: true
          files: |
            dist/tunnel-panel-amd64
            dist/tunnel-panel-arm64
            dist/SHA256SUMS
