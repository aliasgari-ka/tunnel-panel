name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the arm64 cross compiler (apt)
        timeout-minutes: 6
        continue-on-error: true # the runner's Ubuntu mirror hangs/fails at times: zig below covers it
        run: |
          inst() { sudo timeout 120 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 "$@"; }
          inst update -qq && inst install -y -qq gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: zig (cross C compiler without apt)
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Build
        run: |
          bash build.sh amd64 arm64
          # VERSION: what the panels' automatic update installs (it must match the binary's --version)
          dist/tunnel-panel-amd64 --version | awk '{print $2}' > dist/VERSION && cat dist/VERSION
          cd dist && sha256sum tunnel-panel-amd64 tunnel-panel-arm64 VERSION > SHA256SUMS && cat SHA256SUMS
      # Only main (or a v* tag) becomes "latest", which every panel's automatic update installs.
      # A run on any other branch goes to the "branch-build" pre-release instead: on 2026-11-14 a
      # branch run overwrote "latest" and the panel auto-updated to a build that was not on main.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || (github.ref == 'refs/heads/main' && 'latest' || 'branch-build') }}
          prerelease: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/main' }}
          make_latest: ${{ (github.ref_type == 'tag' || github.ref == 'refs/heads/main') && 'true' || 'false' }}
          files: |
            dist/tunnel-panel-amd64
            dist/tunnel-panel-arm64
            dist/SHA256SUMS
            dist/VERSION

  # box64 runs the amd64-only Backhaul Premium v2 core on ARM servers (ipx needs it: qemu-user
  # can't open ipx's packet socket). Ubuntu 22.04 has no box64 package, so it is built here
  # from the pinned upstream source, natively on arm64 with 22.04's glibc, and published
  # next to the panel; the panel installs it on an ARM server when Premium ipx needs it.
  box64:
    needs: build
    runs-on: ubuntu-22.04-arm
    env:
      BOX64_VER: v0.4.4
      BOX64_SRC_SHA256: 99c6de4f509e46ab1de15df740d0e0ea338a7790efa3f67510dfbb975cc24029
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: out
          key: box64-${{ env.BOX64_VER }}-${{ env.BOX64_SRC_SHA256 }}-mmsg2-jammy-arm64
      - name: Build box64 (pinned source)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake python3 build-essential
          curl -fsSL -o box64.tgz "https://github.com/ptitSeb/box64/archive/refs/tags/${BOX64_VER}.tar.gz"
          echo "${BOX64_SRC_SHA256}  box64.tgz" | sha256sum -c -
          mkdir src && tar -xzf box64.tgz -C src --strip-components=1
          # Upstream box64 doesn't pass these x86-64 syscalls through, and the Premium core's ipx
          # loop needs them (ENOSYS on every packet otherwise): ppoll (271), recvmmsg (299),
          # sendmmsg (307). Same args and structs on arm64. (Not pidfd_send_signal: once it works,
          # Go's os/exec forks with clone(CLONE_PIDFD), and box64's clone wrapper smashes its stack.)
          sed -i -e '/\[270\] = {__NR_pselect6, 6},/a \    [271] = {__NR_ppoll, 5},' \
            -e '/\[302\] = {__NR_prlimit64, 4},/a \    [299] = {__NR_recvmmsg, 5},\n    [307] = {__NR_sendmmsg, 4},' src/src/emu/x64syscall.c
          for n in 271 299 307; do grep -q "^ *\[$n\] = " src/src/emu/x64syscall.c; done
          cmake -S src -B build -DARM_DYNAREC=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j"$(nproc)"
          mkdir -p out && cp build/box64 out/box64-arm64 && strip out/box64-arm64
          out/box64-arm64 --version
          (cd out && sha256sum box64-arm64 > box64-arm64.sha256 && cat box64-arm64.sha256)
      - name: Publish box64 with the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || (github.ref == 'refs/heads/main' && 'latest' || 'branch-build') }}
          files: |
            out/box64-arm64
            out/box64-arm64.sha256
