name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the arm64 cross compiler
        timeout-minutes: 12
        # the runner's default (Azure) Ubuntu mirror sometimes hangs: bounded tries, then the main mirror
        run: |
          inst() { sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 "$@"; }
          for i in 1 2; do
            inst update -qq && inst install -y -qq gcc-aarch64-linux-gnu libc6-dev-arm64-cross && exit 0
            echo "apt attempt $i failed — switching to archive.ubuntu.com"
            sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          done
          exit 1
      - name: Build
        run: |
          bash build.sh amd64 arm64
          cd dist && sha256sum tunnel-panel-amd64 tunnel-panel-arm64 > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          make_latest: true
          files: |
            dist/tunnel-panel-amd64
            dist/tunnel-panel-arm64
            dist/SHA256SUMS
